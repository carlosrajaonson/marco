<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16224f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pilotage financier</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#0e1530;--mut:#6b7590;--line:#e4e8f1;--acc:#3b5bfd;--pos:#12b886;--neg:#f0524f;--r:20px}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151c33;--ink:#eef1fb;--mut:#97a1bd;--line:#232c4a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
h1{flex:1;font-size:24px;margin:0;letter-spacing:-.02em}
.ib{position:relative;width:42px;height:42px;border:0;border-radius:14px;background:var(--card);color:var(--ink);display:grid;place-items:center}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:99px;font:inherit}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:4px 16px;max-width:720px;margin:auto}
.hero{border-radius:28px;padding:20px;color:#fff;background:linear-gradient(140deg,#16224f,#3b5bfd 70%,#30c4d6);margin-bottom:14px}
.hero small{opacity:.8}.hero .big{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pair div{background:#ffffff22;border-radius:16px;padding:10px 12px}.pair b{display:block;font-size:17px}
.sc{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.sc>*{flex:none;scroll-snap-align:center}
.mini{background:var(--card);border-radius:var(--r);padding:12px 14px;min-width:140px}.mini small{color:var(--mut);display:block}.mini b{display:block;font-size:17px}
.slide{width:min(86vw,420px);background:var(--card);border-radius:var(--r);padding:14px}
.slide h3{font-size:14px;margin:0 0 8px}.ch{height:220px;position:relative}
h2.sec{font-size:17px;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);padding:12px;border-radius:18px;margin-bottom:8px;font:inherit}
.av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700}
.tx{flex:1;min-width:0}.tx b,.tx small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx small,.mut{color:var(--mut)}
.am{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}.am small{display:block;font-weight:500}
.pos{color:var(--pos)}.neg{color:var(--neg)}.bad{color:var(--neg);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--mut);display:grid;justify-items:center;gap:2px;font-size:11px}
nav button.on{color:var(--acc)}
nav .fab{flex:none;width:58px;height:58px;margin-top:-28px;border-radius:50%;color:#fff;background:linear-gradient(140deg,#3b5bfd,#30c4d6);box-shadow:0 8px 20px #3b5bfd55}
dialog{border:0;padding:0;margin:auto 0 0;width:100%;max-width:100%;max-height:92vh;border-radius:26px 26px 0 0;background:var(--card);color:var(--ink);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
dialog::backdrop{background:#0b102088}
#f{display:grid;gap:12px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
#f h2{margin:0;font-size:20px}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
input,select{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
input[type=color]{padding:3px;height:46px}
#w_a{font-size:30px;font-weight:700}
fieldset{border:1px solid var(--line);border-radius:16px;padding:10px}legend{font-weight:600;padding:0 6px}
.rw{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}.rw select{flex:1 1 130px}.rw input{width:84px}
.bar{display:flex;gap:8px}.bar .btn{flex:1}
.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--bg);color:var(--ink);font:inherit;font-weight:600}
.btn.p{background:var(--acc);color:#fff}.btn.d{color:var(--neg)}.btn.s{padding:8px 12px;font-size:13px}.btn:disabled{opacity:.4}
.acts{display:grid;gap:8px}.acts .btn{text-align:left;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#auth{max-width:360px;margin:14vh auto;padding:24px;display:grid;gap:12px}
#msg{color:var(--neg);padding:0 18px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<form id="auth" hidden>
  <h1>Pilotage financier</h1>
  <label>E-mail<input id="em" type="email" required autocomplete="username"></label>
  <label>Mot de passe<input id="pw" type="password" required autocomplete="current-password"></label>
  <button class="btn p">Se connecter</button>
  <span id="err" class="neg"></span>
</form>
<div id="app" hidden>
  <header id="hd"></header>
  <div id="chips"></div>
  <div id="msg"></div>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<dialog id="dlg"><form id="f"></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="supabase.js"></script>
<script>
/* ---------- Listes ---------- */
const NAT=['Dépense','Recette','Transfert','Prêt accordé','Emprunt reçu','Remboursement de prêt','Apport','Retrait / distribution','Autre'];
const IMP=['Charge supportée','Recette bénéficiaire','Prêteur','Emprunteur','Apporteur','Bénéficiaire (apport / distribution)','Autre'];
const TDET=['Prêt remboursable','Avance remboursable','Apport non remboursable','Prise en charge définitive'];
const NPREV=['Recette attendue','Remboursement attendu','Dépense prévue','Remboursement à payer','Investissement'];
const SENS={'Dépense':'Sortie','Recette':'Entrée','Transfert':'Équilibré'};
const REMB={'Prêt remboursable':1,'Avance remboursable':1};
const SIGN={'Recette attendue':1,'Remboursement attendu':1,'Dépense prévue':-1,'Remboursement à payer':-1,'Investissement':-1};
const PAL=['#0f5c73','#d29a2b','#6b5ba8','#1f7a4d','#b3412e','#4d8fb5','#8a8f98','#c4688a','#5c7a29','#a5702a'];

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(n||0));
const pc=n=>Math.round((n||0)*100)+' %';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const ym=i=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const cls=n=>n<0?'neg':'pos';
let D={},OM={},F={from:'',to:'',actor:'',wallet:'',cat:''},tab='home',charts={};
const TOL=()=>+(D.settings.tolerance??.5), HOR=()=>+(D.settings.horizon_days??90);

/* ---------- Configuration des tables ---------- */
const c=(k,l,t='t',o,req)=>({k,l,t,o,req});
const CFG={
 recurrences:{pre:'RC-',cols:[]},
 operations:{pre:'OP-',cols:[c('id','ID','t',0,1),c('op_date','Date','d',0,1),c('label','Libellé'),c('nature','Nature','s',NAT,1),c('category','Catégorie','s','cats'),c('amount','Montant (Ar)','n',0,1),c('status','Statut','s',['Réel','Annulé'],1),c('reference','Pièce'),c('notes','Notes')],calc:[['Contrôle',o=>opCheck(o)]]},
 actor_allocations:{auto:1,cols:[c('operation_id','Opération','s','ops',1),c('actor','Acteur','s','actors',1),c('imputation','Imputation','s',IMP,1),c('pct','% (saisie)','p'),c('amount_input','Montant (saisie)','n')],calc:[['Montant retenu',a=>fmt(allocAmt(a))]]},
 wallet_movements:{auto:1,cols:[c('operation_id','Opération','s','ops',1),c('wallet','Portefeuille','s','wallets',1),c('actor','Acteur imputé','s','actors',1),c('direction','Sens','s',['Entrée','Sortie'],1),c('amount','Montant (Ar)','n',0,1)]},
 wallets:{pre:'PF-',cols:[c('id','ID','t',0,1),c('name','Nom','t',0,1),c('type','Type','s',['Compte bancaire','Caisse physique','Mobile Money','Autre'],1),c('legal_holder','Titulaire légal','s','actors',1),c('economic_owner','Propriétaire économique','s','actors',1),c('initial_balance','Solde initial (Ar)','n',0,1),c('ref_date','Date de référence','d')],calc:[['Solde théorique',w=>fmt(bal(w))]]},
 actors:{pre:'AC-',cols:[c('id','ID','t',0,1),c('name','Nom','t',0,1),c('type','Type','s',['Personne','Entreprise'],1),c('status','Statut','s',['Actif','Inactif'],1),c('safety_reserve','Réserve de sécurité (Ar)','n')]},
 debts:{pre:'DT-',cols:[c('id','ID','t',0,1),c('debt_date','Date','d',0,1),c('creditor','Créancier','s','actors',1),c('debtor','Débiteur','s','actors',1),c('type','Type','s',TDET,1),c('initial_amount','Montant initial (Ar)','n',0,1),c('repaid','Remboursé cumulé (Ar)','n'),c('due_date','Échéance','d'),c('operation_id','Opération liée','s','ops'),c('notes','Notes')],calc:[['Solde dû',d=>fmt(due(d))],['Statut',d=>dStat(d)]]},
 forecasts:{pre:'PV-',cols:[c('id','ID','t',0,1),c('forecast_date','Date prévue','d',0,1),c('nature','Nature','s',NPREV,1),c('actor','Acteur','s','actors',1),c('wallet','Portefeuille','s','wallets'),c('category','Catégorie','s','cats'),c('label','Libellé'),c('amount','Montant (Ar)','n',0,1),c('probability','Probabilité','p',0,1)],calc:[['Pondéré signé',f=>fmt(wf(f))]]}
};
const TABS=[['dash','Dashboard'],['patrimoine','Patrimoine'],['operations','Opérations'],['actor_allocations','Répartition'],['wallet_movements','Mouvements'],['wallets','Portefeuilles'],['actors','Acteurs'],['debts','Dettes & créances'],['forecasts','Prévisions'],['controles','Contrôles']];

/* ---------- Calculs (équivalents des formules Excel) ---------- */
const side=a=>(a.imputation==='Emprunteur'||a.imputation==='Bénéficiaire (apport / distribution)')?2:1;
const allocAmt=a=>a.amount_input!=null?+a.amount_input:(+a.pct||0)*(OM[a.operation_id]?.amount||0);
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
function bal(w,upto){
  return +w.initial_balance+sum(D.wallet_movements.filter(m=>m.wallet===w.name),m=>{
    const o=OM[m.operation_id];
    if(!o||o.status!=='Réel'||(w.ref_date&&o.op_date<w.ref_date)||(upto&&o.op_date>upto))return 0;
    return (m.direction==='Entrée'?1:-1)*m.amount;});
}
const due=d=>REMB[d.type]?Math.max(d.initial_amount-(d.repaid||0),0):0;
const dStat=d=>!REMB[d.type]?'Définitif':due(d)<=TOL()?'Soldé':(d.due_date&&d.due_date<today()?'En retard':'En cours');
const wf=f=>(SIGN[f.nature]||0)*f.amount*f.probability;
function opCheck(o){
  if(o.status==='Annulé')return 'Annulée';
  const A=D.actor_allocations.filter(a=>a.operation_id===o.id),M=D.wallet_movements.filter(m=>m.operation_id===o.id),t=TOL();
  const K=sum(A.filter(a=>side(a)==1),allocAmt),L=sum(A.filter(a=>side(a)==2),allocAmt);
  const O=sum(M.filter(m=>m.direction==='Entrée'),m=>m.amount),P=sum(M.filter(m=>m.direction==='Sortie'),m=>m.amount);
  const s=SENS[o.nature]||'Libre',gap='ERREUR : écart montant/mouvements';
  if(!o.op_date||!o.nature||!(o.amount>0))return 'ERREUR : saisie incomplète';
  if(!A.length)return 'ERREUR : sans ventilation acteurs';
  if(Math.abs(K-o.amount)>t)return 'ERREUR : écart répartition acteurs';
  if(L>t&&Math.abs(L-o.amount)>t)return 'ERREUR : écart répartition contrepartie';
  if(!M.length)return 'ERREUR : sans mouvement portefeuille';
  if(s==='Équilibré')return Math.abs(O-P)>t?'ERREUR : transfert déséquilibré':Math.abs(O-o.amount)>t?gap:'OK';
  if(s==='Sortie')return O>t?'ERREUR : entrée inattendue':Math.abs(P-o.amount)>t?gap:'OK';
  if(s==='Entrée')return P>t?'ERREUR : sortie inattendue':Math.abs(O-o.amount)>t?gap:'OK';
  if(O>t&&P>t&&Math.abs(O-P)>t)return 'ERREUR : entrées ≠ sorties';
  return Math.abs(Math.max(O,P)-o.amount)>t?gap:'OK';
}

/* ---------- Filtres ---------- */
function dateOf(t,r){return t==='operations'?r.op_date:t==='debts'?r.debt_date:t==='forecasts'?r.forecast_date:r.operation_id?OM[r.operation_id]?.op_date:null}
function rowOK(t,r){
  const d=dateOf(t,r);
  if(d&&((F.from&&d<F.from)||(F.to&&d>F.to)))return false;
  if(F.actor){
    if(t==='operations'&&!D.actor_allocations.some(a=>a.operation_id===r.id&&a.actor===F.actor))return false;
    const v=[r.actor,r.creditor,r.debtor,r.legal_holder,r.economic_owner,t==='actors'?r.name:null];
    if(v.some(x=>x!=null)&&!v.includes(F.actor))return false;
  }
  if(F.wallet){
    if(t==='operations'&&!D.wallet_movements.some(m=>m.operation_id===r.id&&m.wallet===F.wallet))return false;
    if(t==='wallets'&&r.name!==F.wallet)return false;
    if((t==='wallet_movements'||t==='forecasts')&&r.wallet!==F.wallet)return false;
  }
  if(F.cat&&'category' in r&&r.category!==F.cat)return false;
  return true;
}
function fOps(){return D.operations.filter(o=>o.status==='Réel'&&rowOK('operations',o))}
function amt(o){
  if(F.wallet)return sum(D.wallet_movements.filter(m=>m.operation_id===o.id&&m.wallet===F.wallet),m=>m.amount);
  if(F.actor)return sum(D.actor_allocations.filter(a=>a.operation_id===o.id&&a.actor===F.actor),allocAmt);
  return o.amount;
}
const wallets=()=>D.wallets.filter(w=>(!F.wallet||w.name===F.wallet)&&(!F.actor||w.economic_owner===F.actor));

/* ---------- Données ---------- */
async function all(t){
  let out=[],i=0;
  for(;;){
    const{data,error}=await sb.from(t).select('*').range(i,i+999);
    if(error)throw error;
    out=out.concat(data);
    if(data.length<1000)return out;
    i+=1000;
  }
}
async function load(){
  const T=['actors','wallets','categories','settings','operations','actor_allocations','wallet_movements','debts','forecasts','recurrences','recurrence_shares'];
  try{
    const r=await Promise.all(T.map(all));
    T.forEach((t,i)=>D[t]=r[i]);
    D.settings=Object.fromEntries(D.settings.map(s=>[s.key,s.value]));
    OM=Object.fromEntries(D.operations.map(o=>[o.id,o]));_fc=null;
    D.operations.sort((a,b)=>b.op_date.localeCompare(a.op_date)||b.id.localeCompare(a.id));
    $('#msg').textContent='';
  }catch(e){$('#msg').textContent='Erreur de chargement : '+e.message}
}
function fillFilters(){
  const f=(id,arr,ph)=>{const s=$(id),v=s.value;s.innerHTML=`<option value="">${ph}</option>`+arr.map(x=>`<option>${esc(x)}</option>`).join('');s.value=v};
  f('#fa',D.actors.map(a=>a.name),'Tous');f('#fw',D.wallets.map(w=>w.name),'Tous');f('#fc',D.categories.map(x=>x.name),'Toutes');
}

/* ---------- Affichage mobile ---------- */
const MAIN=['home','operations','accounts','more'];
const NAMES={home:'Accueil',operations:'Opérations',accounts:'Comptes',more:'Plus',debts:'Dettes & créances',forecasts:'Prévisions',actors:'Acteurs',wallets:'Portefeuilles',actor_allocations:'Répartition',wallet_movements:'Mouvements',categories:'Catégories',recurrences:'Récurrences',controles:'Contrôles'};
const ICON={home:'M3 11l9-8 9 8M5 10v10h14V10',list:'M4 6h16M4 12h16M4 18h10',wallet:'M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7zm0 0l2-3h12M16 14h2',more:'M5 12h.01M12 12h.01M19 12h.01',plus:'M12 5v14M5 12h14',filter:'M3 5h18l-7 8v6l-4-2v-4L3 5z',back:'M15 18l-6-6 6-6'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`;
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'2-digit'}):'';
const sg=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));
const colOf=n=>D.categories.find(x=>x.name===n)?.color||PAL[Math.max(0,D.categories.findIndex(x=>x.name===n))%PAL.length];
const yAx={ticks:{callback:v=>Math.abs(v)>=1e6?v/1e6+' M':Math.abs(v)>=1e3?v/1e3+' k':v}};
const tip={plugins:{legend:{labels:{boxWidth:10,usePointStyle:true}},tooltip:{callbacks:{label:x=>`${x.dataset.label||x.label} : ${fmt(x.parsed.y??x.parsed)} Ar`}}}};
let PER='0';
function mk(id,cfg){charts[id]?.destroy();const el=$('#'+id);if(!el)return;cfg.options={responsive:true,maintainAspectRatio:false,...cfg.options};charts[id]=new Chart(el,cfg)}
const mini=(l,v,k)=>`<div class="mini"><small>${l}</small><b class="${k||''}">${v}</b></div>`;
function anomalies(){
  const A=[];
  D.operations.forEach(o=>{const r=opCheck(o);if(r.startsWith('ERREUR'))A.push(['Opérations',o.id,r])});
  D.wallets.forEach(w=>{if(bal(w)<0)A.push(['Alerte · Portefeuilles',w.name,'solde théorique négatif'])});
  D.debts.forEach(d=>{if(dStat(d)==='En retard')A.push(['Alerte · Dettes',d.id,'échéance dépassée'])});
  return A;
}

const LV={
 operations:o=>{const s=o.nature==='Dépense'?-1:o.nature==='Recette'?1:0;return[o.label||o.nature,`${fd(o.op_date)} · ${o.category||o.nature}${o.status==='Annulé'?' · annulée':''}`,s?sg(s*o.amount):fmt(o.amount),s>0?'pos':s<0?'neg':'',opCheck(o).startsWith('ERREUR')?'⚠ à corriger':'']},
 actor_allocations:a=>[a.actor,`${a.operation_id} · ${a.imputation}`,fmt(allocAmt(a))],
 wallet_movements:m=>[m.wallet,`${m.operation_id} · ${m.actor}`,sg(m.direction==='Entrée'?m.amount:-m.amount),m.direction==='Entrée'?'pos':'neg'],
 wallets:w=>[w.name,`${w.economic_owner} · ${w.type}`,fmt(bal(w)),cls(bal(w))],
 actors:a=>[a.name,`${a.type} · ${a.status}`,'Réserve '+fmt(a.safety_reserve)],
 debts:d=>[`${d.debtor} doit à ${d.creditor}`,`${d.type} · ${dStat(d)}${d.due_date?' · éch. '+fd(d.due_date):''}`,fmt(due(d)),dStat(d)==='En retard'?'neg':''],
 forecasts:f=>[f.label||f.nature,`${fd(f.forecast_date)} · ${f.actor} · ${pc(f.probability)}`,sg(wf(f)),cls(wf(f))]
};
function card(t,r){
  const[a,b,c,k,g]=LV[t](r),bg=t==='operations'&&r.category?colOf(r.category):PAL[String(a||'?').charCodeAt(0)%PAL.length];
  return`<button class="row" onclick="edit('${t}','${r.id}')"><span class="av" style="background:${bg}">${esc(String(a||'?')[0].toUpperCase())}</span><span class="tx"><b>${esc(a)}</b><small>${esc(b)}</small></span><span class="am ${k||''}">${c}${g?`<small class="bad">${g}</small>`:''}</span></button>`;
}
function openSheet(html){const f=$('#f');f.oninput=f.onchange=f.onclick=f.onsubmit=null;f.innerHTML=html;$('#dlg').showModal();return f}
const opt2=(arr,v,ph)=>`<option value="">${ph}</option>`+arr.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');

function home(){
  const ops=fOps(),dep=sum(ops.filter(o=>o.nature==='Dépense'),amt),rec=sum(ops.filter(o=>o.nature==='Recette'),amt);

/* ---------- Récurrences : prévisions seulement, aucune opération créée ---------- */
const FREQ={'Hebdomadaire':[0,7],'Mensuelle':[1,0],'Trimestrielle':[3,0],'Annuelle':[12,0]};
function stepDate(s,f,k){
  const[m,dd]=FREQ[f],d=new Date(s+'T00:00:00Z');
  if(dd){d.setUTCDate(d.getUTCDate()+dd*k);return d.toISOString().slice(0,10)}
  const day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+m*k);
  const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();
  d.setUTCDate(Math.min(day,last));return d.toISOString().slice(0,10);
}
function occ(r,n=3){
  const out=[],from=today(),lim=addDays(from,730);
  for(let k=0;k<1500&&out.length<n;k++){
    const d=stepDate(r.start_date,r.frequency,k);
    if(d>lim||(r.end_date&&d>r.end_date))break;
    if(d>=from)out.push(d);
  }
  return out;
}
let _fc=null;
function FC(){
  if(_fc)return _fc;
  const v=[...D.forecasts];
  D.recurrences.filter(r=>r.active).forEach(r=>{
    const sh=D.recurrence_shares.filter(s=>s.recurrence_id===r.id);
    occ(r,200).forEach(d=>sh.forEach(s=>v.push({id:r.id,forecast_date:d,nature:r.nature,actor:s.actor,wallet:r.wallet,category:r.category,label:r.label,amount:r.amount*s.pct,probability:r.probability,rec:1})));
  });
  return _fc=v;
}

    sh:r?D.recurrence_shares.filter(s=>s.recurrence_id===id).map(s=>({actor:s.actor,pct:r2(s.pct*100)})):[{actor:'',pct:100}]};

  const sel=(id,arr,v)=>`<select id="${id}">${arr.map(n=>`<option${n===v?' selected':''}>${n}</option>`).join('')}</select>`;
  function chk(){
    const M=+$('#r_a').value||0,sp=sum(S.sh,x=>+x.pct||0),okSp=Math.abs(sp-100)<.01,okA=S.sh.every(x=>x.actor);
    const nx=occ({start_date:$('#r_s').value||today(),frequency:$('#r_f').value,end_date:$('#r_e').value||null},3);
    $('#r_t').innerHTML=`<small class="${okSp?'':'bad'}">Total : ${sp} %${okSp?' ✔':' — 100 % requis'}</small>${okA?S.sh.map(x=>`<br><small>${esc(x.actor)} : ${fmt(M*x.pct/100)} Ar par échéance</small>`).join(''):''}<br><small class="mut">Prochaines échéances : ${nx.map(fd).join(', ')||'aucune'}</small>`;
    $('#r_ok').disabled=!(okSp&&okA&&M>0&&$('#r_l').value.trim());
  }
  function draw(first){
    if(!first)rd();
    f.innerHTML=`<h2>${r?'Modifier':'Nouvelle'} récurrence</h2>
    <label>Libellé<input id="r_l" required value="${esc(S.label)}"></label>
    <label>Type${sel('r_n',NPREV,S.nature)}</label>
    <label>Montant à chaque échéance (Ar)<input id="r_a" type="number" step="any" min="0.01" required value="${S.amount}"></label>
    <label>Fréquence${sel('r_f',Object.keys(FREQ),S.frequency)}</label>
    <div class="two"><label>À partir du<input id="r_s" type="date" required value="${S.start}"></label><label>Jusqu'au (facultatif)<input id="r_e" type="date" value="${S.end}"></label></div>
    <div class="two"><label>Probabilité (%)<input id="r_p" type="number" min="0" max="100" step="any" value="${S.prob}"></label><label>Catégorie<select id="r_c">${opt2(D.categories.map(x=>x.name),S.cat,'—')}</select></label></div>
    <label>Portefeuille (facultatif)<select id="r_w">${opt2(D.wallets.map(x=>x.name),S.wallet,'—')}</select></label>
    <fieldset><legend>Qui est concerné, pour quel % ?</legend>${S.sh.map((x,i)=>`<div class="rw"><select data-i="${i}" data-k="actor">${opt2(AN,x.actor,'Acteur')}</select><input type="number" step="any" min="0" max="100" data-i="${i}" data-k="pct" value="${x.pct}" aria-label="Pourcentage"> %<button type="button" class="btn s" data-rm="${i}" aria-label="Retirer">✕</button></div>`).join('')}<button type="button" class="btn s" data-add="1">+ Ajouter un acteur</button></fieldset>
    <div id="r_t"></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="r_x" type="checkbox" style="width:auto" ${S.active?'checked':''}> Active (décochez pour mettre en pause)</label>

    chk();
  }
  f.oninput=f.onchange=e=>{const d=e.target.dataset;if(d.k)S.sh[d.i][d.k]=d.k==='pct'?+e.target.value:e.target.value;chk()};

    const{error}=await sb.rpc('save_recurrence',{p});
    if(error){alert('Enregistrement refusé : '+error.message);return}
    $('#dlg').close();await refresh();
  };
  draw(1);
}

function per(p){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(p==='m'){F.from=iso(new Date(y,m,1));F.to=iso(new Date(y,m+1,0))}
  else if(p==='30'){F.to=today();F.from=addDays(F.to,-30)}
  else if(p==='y'){F.from=y+'-01-01';F.to=y+'-12-31'}
  else F.from=F.to='';
  PER=p;render();
}

  $('#chips').hidden=!['home','operations'].includes(tab);
  $('#chips').innerHTML=[['m','Ce mois'],['30','30 jours'],['y','Année'],['0','Tout']].map(([k,l])=>`<button class="chip ${PER===k?'on':''}" data-p="${k}">${l}</button>`).join('')+`<button class="chip ${PER==='c'?'on':''}" data-p="c">${PER==='c'&&(F.from||F.to)?`${fd(F.from)||'…'} → ${fd(F.to)||'…'}`:'Dates…'}</button>`;
  const cur=MAIN.includes(tab)?tab:'more',nb=([k,l,i])=>`<button data-t="${k}" class="${cur===k?'on':''}">${ic(i)}${l}</button>`;
  $('#nav').innerHTML=[['home','Accueil','home'],['operations','Opérations','list']].map(nb).join('')+`<button class="fab" id="fab" aria-label="Ajouter">${ic('plus')}</button>`+[['accounts','Comptes','wallet'],['more','Plus','more']].map(nb).join('');
  Object.values(charts).forEach(ch=>ch.destroy());charts={};
  ({home,operations:()=>list('operations'),accounts,more,categories:cats,recurrences:recs,controles}[tab]||(()=>list(tab)))();
}

/* ---------- Saisie ---------- */
const opts=o=>o==='cats'?D.categories.map(x=>x.name):o==='actors'?D.actors.map(x=>x.name):o==='wallets'?D.wallets.map(x=>x.name):o==='ops'?D.operations.map(x=>x.id):o;
function edit(t,id){
  if(t==='operations'&&id!=null&&['Dépense','Recette'].includes(OM[id]?.nature))return wiz(OM[id].nature,id);
  const cf=CFG[t],r=id!=null?D[t].find(x=>String(x.id)===String(id)):null;
  const next=cf.pre?cf.pre+String(Math.max(0,...D[t].map(x=>parseInt(String(x.id).replace(/\D/g,''))||0))+1).padStart(4,'0'):'';
  {const f0=$('#f');f0.oninput=f0.onchange=f0.onclick=null}
  $('#f').innerHTML=`<h2>${r?'Modifier':'Ajouter'} · ${NAMES[t]||t}</h2>`+cf.cols.filter(x=>!(cf.auto&&x.k==='id')).map(x=>{
    let v=r?r[x.k]:(x.k==='id'?next:x.k==='status'&&t==='operations'?'Réel':'');v=v??'';
    const q=x.req?' required':'',nm=` name="${x.k}"`;
    if(x.t==='s')return`<label>${x.l}<select${nm}${q}><option value="">—</option>${opts(x.o).map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
    if(x.t==='p')return`<label>${x.l} (en %)<input${nm}${q} type="number" step="any" min="0" max="100" value="${v===''?'':Math.round(v*10000)/100}"></label>`;
    return`<label>${x.l}<input${nm}${q} type="${x.t==='d'?'date':x.t==='n'?'number':'text'}"${x.t==='n'?' step="any"':''} value="${esc(v)}"${r&&x.k==='id'?' readonly':''}></label>`;
  }).join('')+`<div class="bar"><button type="button" class="btn" onclick="$('#dlg').close()">Annuler</button>${r?`<button type="button" class="btn d" onclick="$('#dlg').close();del('${t}','${r.id}')">Supprimer</button>`:''}<button class="btn p">Enregistrer</button></div>`;
  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const o={};
    cf.cols.forEach(x=>{
      const el=$('#f').elements[x.k];if(!el)return;
      let v=el.value;
      o[x.k]=v===''?null:x.t==='n'?+v:x.t==='p'?+v/100:v;
    });
    if(t==='debts'&&o.repaid==null)o.repaid=0;
    if(t==='actors'&&o.safety_reserve==null)o.safety_reserve=0;
    if(t==='wallets'&&o.initial_balance==null)o.initial_balance=0;
    const q=r?sb.from(t).update(o).eq('id',r.id):sb.from(t).insert(o);
    const{error}=await q;
    if(error){alert('Enregistrement refusé : '+error.message);return}
    $('#dlg').close();await refresh();
  };
  $('#dlg').showModal();
}
async function del(t,id){
  if(!confirm('Supprimer cette ligne ?'+(t==='operations'?' Sa répartition et ses mouvements seront supprimés aussi.':'')))return;
  if(t==='operations')await sb.from('debts').delete().eq('operation_id',id).eq('notes','Auto');
  const{error}=await sb.from(t).delete().eq('id',id);
  if(error){alert('Suppression refusée : '+error.message);return}
  await refresh();
}
async function refresh(){await load();fillFilters();render()}

/* ---------- Saisie guidée : dépense / entrée ---------- */
const r2=x=>Math.round(x*100)/100;
const nextId=t=>CFG[t].pre+String(Math.max(0,...D[t].map(x=>parseInt(String(x.id).replace(/\D/g,''))||0))+1).padStart(4,'0');
function split(M,rows){let acc=0;return rows.map((x,i)=>{const a=i===rows.length-1?r2(M-acc):r2(M*x.pct/100);acc+=a;return a})}
function calcDebts(M,P,B,isD){
  const net={};
  split(M,P).forEach((a,i)=>net[P[i].actor]=(net[P[i].actor]||0)+a);
  split(M,B).forEach((a,i)=>net[B[i].actor]=(net[B[i].actor]||0)-a);
  const pos=Object.entries(net).filter(e=>e[1]>.005),neg=Object.entries(net).filter(e=>e[1]<-.005),sp=sum(pos,e=>e[1]),out=[];
  neg.forEach(([n,v])=>pos.forEach(([p,w])=>{const a=r2(-v*w/sp);if(a>=.01)out.push(isD?{creditor:p,debtor:n,amount:a}:{creditor:n,debtor:p,amount:a})}));
  return out;
}
function wiz(nature,id){
  const isD=nature==='Dépense',r=id?OM[id]:null,f=$('#f');
  const S={id:r?.id||nextId('operations'),amount:r?.amount||'',date:r?.op_date||today(),label:r?.label||'',cat:r?.category||'',ref:r?.reference||'',P:[{actor:'',pct:100,wallet:''}],B:[{actor:'',pct:100}]};
  if(r){
    S.P=D.wallet_movements.filter(m=>m.operation_id===id).map(m=>({actor:m.actor,wallet:m.wallet,pct:r2(m.amount/r.amount*100)}));
    S.B=D.actor_allocations.filter(a=>a.operation_id===id).map(a=>({actor:a.actor,pct:r2(allocAmt(a)/r.amount*100)}));
  }
  const opt=(arr,v,ph)=>`<option value="">${ph}</option>`+arr.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
  const AN=D.actors.map(a=>a.name),WN=D.wallets.map(w=>w.name);
  const read=()=>{S.amount=$('#w_a').value;S.date=$('#w_d').value;S.label=$('#w_l').value;S.cat=$('#w_c').value;S.ref=$('#w_r').value};
  const row=(g,x,i)=>`<div class="rw"><select data-g="${g}" data-i="${i}" data-k="actor" required>${opt(AN,x.actor,'Acteur')}</select>
    <input type="number" step="any" min="0" max="100" data-g="${g}" data-i="${i}" data-k="pct" value="${x.pct}" aria-label="Pourcentage"> %
    ${g==='P'?`<select data-g="P" data-i="${i}" data-k="wallet" required>${opt(WN,x.wallet,isD?'Source (portefeuille)':'Portefeuille')}</select>`:''}
    <button type="button" class="btn s" data-rm="${g}:${i}" aria-label="Retirer">✕</button></div>`;
  function draw(first){
    if(!first)read();
    f.innerHTML=`<h2>${r?'Modifier':'Nouvelle'} ${isD?'dépense':'entrée d\'argent'} · ${S.id}</h2>
    <label>Combien (Ar)<input id="w_a" type="number" step="any" min="0.01" required value="${S.amount}"></label>
    <label>Quand<input id="w_d" type="date" required value="${S.date}"></label>
    <label>${isD?'Pour quoi':'Pourquoi (motif)'}<input id="w_l" required value="${esc(S.label)}"></label>
    <label>Catégorie<select id="w_c">${opt(D.categories.map(x=>x.name),S.cat,'—')}<option value="__new">＋ Nouvelle catégorie…</option></select></label>
    <fieldset><legend>${isD?'Qui paie, de quelle source, et pour quel % ?':'Qui reçoit, sur quel portefeuille, et pour quel % ?'}</legend>${S.P.map((x,i)=>row('P',x,i)).join('')}<button type="button" class="btn s" data-add="P">+ Ajouter</button></fieldset>
    <fieldset><legend>${isD?'Pour qui (bénéficiaire), et pour quel % ?':'À qui revient cet argent, et pour quel % ?'}</legend>${S.B.map((x,i)=>row('B',x,i)).join('')}<button type="button" class="btn s" data-add="B">+ Ajouter</button></fieldset>
    <div id="w_s"></div>
    <label>Pièce / référence<input id="w_r" value="${esc(S.ref)}"></label>
    <div class="bar"><button type="button" class="btn" onclick="$('#dlg').close()">Annuler</button>${r?`<button type="button" class="btn d" onclick="$('#dlg').close();del('operations','${r.id}')">Supprimer</button>`:''}<button class="btn p" id="w_ok">Enregistrer</button></div>`;
    check();
  }
  function check(){
    const M=+$('#w_a').value||0,sp=sum(S.P,x=>+x.pct||0),sbn=sum(S.B,x=>+x.pct||0);
    const okP=Math.abs(sp-100)<.01&&S.P.every(x=>x.actor&&x.wallet),okB=Math.abs(sbn-100)<.01&&S.B.every(x=>x.actor),ok=okP&&okB&&M>0;
    const ds=ok?calcDebts(M,S.P,S.B,isD):[];
    $('#w_s').innerHTML=`<small class="${okP?'':'bad'}">${isD?'Payeurs':'Receveurs'} : ${sp} % ${okP?'✔':'— total 100 % requis, avec acteur et portefeuille sur chaque ligne'}</small><br>
    <small class="${okB?'':'bad'}">${isD?'Bénéficiaires':'Ayants droit'} : ${sbn} % ${okB?'✔':'— total 100 % requis'}</small>`+
    (ds.length?`<p><b>Dettes créées automatiquement</b><br>${ds.map(d=>`${esc(d.debtor)} doit ${fmt(d.amount)} Ar à ${esc(d.creditor)}`).join('<br>')}</p>`:ok?`<p><small>Aucune dette : ${isD?'ceux qui paient sont les bénéficiaires':'ceux qui reçoivent sont les ayants droit'}.</small></p>`:'');
    $('#w_ok').disabled=!ok;
  }
  f.oninput=f.onchange=e=>{
    const t=e.target,d=t.dataset;
    if(t.id==='w_c'&&t.value==='__new'){(async()=>{read();S.cat=(await newCat())||'';draw(1)})();return}
    if(d.g){
      const x=S[d.g][d.i];x[d.k]=d.k==='pct'?+t.value:t.value;
      if(d.k==='actor'&&d.g==='P'&&e.type==='change'){x.wallet=(D.wallets.find(w=>w.economic_owner===t.value)||{name:x.wallet}).name;draw();return}
    }
    check();
  };
  f.onclick=e=>{
    const d=e.target.dataset;
    if(d.add){read();const left=Math.max(0,r2(100-sum(S[d.add],x=>+x.pct||0)));S[d.add].push(d.add==='P'?{actor:'',pct:left,wallet:''}:{actor:'',pct:left});draw()}
    if(d.rm){const[g,i]=d.rm.split(':');if(S[g].length>1){read();S[g].splice(+i,1);draw()}}
  };
  f.onsubmit=async e=>{
    e.preventDefault();
    const M=+$('#w_a').value,ds=calcDebts(M,S.P,S.B,isD);
    if(r&&D.debts.some(d=>d.operation_id===id&&d.notes==='Auto'&&d.repaid>0)&&!confirm('Des remboursements ont déjà été saisis sur les dettes de cette opération : elles seront recalculées et ces remboursements perdus. Continuer ?'))return;
    const pm=split(M,S.P),bm=split(M,S.B),n=parseInt(nextId('debts').replace(/\D/g,''));
    const payload={op:{id:S.id,op_date:$('#w_d').value,label:$('#w_l').value,nature,category:$('#w_c').value||null,amount:M,status:'Réel',reference:$('#w_r').value||null},
      allocations:S.B.map((x,i)=>({actor:x.actor,imputation:isD?'Charge supportée':'Recette bénéficiaire',pct:x.pct/100,amount_input:bm[i]})),
      movements:S.P.map((x,i)=>({wallet:x.wallet,actor:x.actor,direction:isD?'Sortie':'Entrée',amount:pm[i]})),
      debts:ds.map((d,i)=>({...d,id:'DT-'+String(n+i).padStart(4,'0')}))};
    const{error}=await sb.rpc('save_operation',{p:payload});
    if(error){alert('Enregistrement refusé : '+error.message);return}
    $('#dlg').close();await refresh();
  };
  draw(1);$('#dlg').showModal();
}

/* ---------- Événements ---------- */
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.id==='fab'?fab():go(b.dataset.t)};
$('#chips').onclick=e=>{const p=e.target.dataset.p;if(p)p==='c'?openFilters():per(p)};
$('#dlg').onclick=e=>{if(e.target.id==='dlg')$('#dlg').close()};
async function start(){$('#auth').hidden=true;$('#app').hidden=false;await refresh()}
$('#auth').onsubmit=async e=>{
  e.preventDefault();
  const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
  if(error)$('#err').textContent=error.message;else start();
};
(async()=>{
  if(SUPABASE_URL.includes('VOTRE')){document.body.innerHTML='<p style="padding:24px">Renseignez SUPABASE_URL et SUPABASE_ANON_KEY dans <b>supabase.js</b>.</p>';return}
  const{data:{session}}=await sb.auth.getSession();
  session?start():$('#auth').hidden=false;
})();
</script>
