<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilotage financier</title>
<style>
:root{--ink:#16212b;--mut:#5d6b78;--bg:#eef1f4;--line:#d9e0e6;--acc:#0f5c73;--pos:#1f7a4d;--neg:#b3412e}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:10px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;color:#b9c4cd;padding:7px 11px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:#fff;color:var(--ink);font-weight:600}
.filters{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:9px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:grid;gap:2px;font-size:12px;color:var(--mut)}
input,select,button{font:inherit}
input,select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
.btn{padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.s{padding:2px 8px;font-size:12px}
main{padding:18px;max-width:1400px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.k,.box{background:#fff;border:1px solid var(--line);border-radius:8px}
.k{padding:10px 12px}.k small{color:var(--mut);display:block}.k b{font-size:20px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:14px}
.box{padding:12px;overflow:auto;margin-bottom:14px}.grid .box{margin:0}
.box h2{font-size:14px;margin:0 0 8px}
.ch{height:270px;position:relative}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.bad{color:var(--neg);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
dialog{border:1px solid var(--line);border-radius:10px;padding:18px;width:min(520px,94vw)}
dialog form{display:grid;gap:10px}
#auth{max-width:340px;margin:12vh auto;background:#fff;padding:22px;border-radius:10px;border:1px solid var(--line);display:grid;gap:10px}
#msg{color:var(--neg);padding:0 18px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<form id="auth" hidden>
  <h1>Pilotage financier</h1>
  <label>E-mail<input id="em" type="email" required autocomplete="username"></label>
  <label>Mot de passe<input id="pw" type="password" required autocomplete="current-password"></label>
  <button class="btn p">Se connecter</button>
  <span id="err" class="neg"></span>
</form>

<div id="app" hidden>
  <header><h1>Pilotage financier</h1><nav id="tabs"></nav><button class="btn" id="out">Se déconnecter</button></header>
  <section class="filters">
    <label>Du<input type="date" id="fd"></label>
    <label>Au<input type="date" id="ft"></label>
    <label>Acteur<select id="fa"></select></label>
    <label>Portefeuille<select id="fw"></select></label>
    <label>Catégorie<select id="fc"></select></label>
    <span><button class="btn" data-p="m">Ce mois</button> <button class="btn" data-p="30">30 jours</button> <button class="btn" data-p="y">Cette année</button> <button class="btn" data-p="0">Tout</button></span>
  </section>
  <div id="msg"></div>
  <main id="view"></main>
</div>
<dialog id="dlg"><form id="f"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="supabase.js"></script>
<script>
/* ---------- Listes ---------- */
const NAT=['Dépense','Recette','Transfert','Prêt accordé','Emprunt reçu','Remboursement de prêt','Apport','Retrait / distribution','Autre'];
const IMP=['Charge supportée','Recette bénéficiaire','Prêteur','Emprunteur','Apporteur','Bénéficiaire (apport / distribution)','Autre'];
const TDET=['Prêt remboursable','Avance remboursable','Apport non remboursable','Prise en charge définitive'];
const NPREV=['Recette attendue','Remboursement attendu','Dépense prévue','Remboursement à payer','Investissement'];
const SENS={'Dépense':'Sortie','Recette':'Entrée','Transfert':'Équilibré'};
const REMB={'Prêt remboursable':1,'Avance remboursable':1};
const SIGN={'Recette attendue':1,'Remboursement attendu':1,'Dépense prévue':-1,'Remboursement à payer':-1,'Investissement':-1};
const PAL=['#0f5c73','#d29a2b','#6b5ba8','#1f7a4d','#b3412e','#4d8fb5','#8a8f98','#c4688a','#5c7a29','#a5702a'];

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(n||0));
const pc=n=>Math.round((n||0)*100)+' %';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const ym=i=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const cls=n=>n<0?'neg':'pos';
let D={},OM={},F={from:'',to:'',actor:'',wallet:'',cat:''},tab='dash',charts={};
const TOL=()=>+(D.settings.tolerance??.5), HOR=()=>+(D.settings.horizon_days??90);

/* ---------- Configuration des tables ---------- */
const c=(k,l,t='t',o,req)=>({k,l,t,o,req});
const CFG={
 operations:{pre:'OP-',cols:[c('id','ID','t',0,1),c('op_date','Date','d',0,1),c('label','Libellé'),c('nature','Nature','s',NAT,1),c('category','Catégorie','s','cats'),c('amount','Montant (Ar)','n',0,1),c('status','Statut','s',['Réel','Annulé'],1),c('reference','Pièce'),c('notes','Notes')],calc:[['Contrôle',o=>opCheck(o)]]},
 actor_allocations:{auto:1,cols:[c('operation_id','Opération','s','ops',1),c('actor','Acteur','s','actors',1),c('imputation','Imputation','s',IMP,1),c('pct','% (saisie)','p'),c('amount_input','Montant (saisie)','n')],calc:[['Montant retenu',a=>fmt(allocAmt(a))]]},
 wallet_movements:{auto:1,cols:[c('operation_id','Opération','s','ops',1),c('wallet','Portefeuille','s','wallets',1),c('actor','Acteur imputé','s','actors',1),c('direction','Sens','s',['Entrée','Sortie'],1),c('amount','Montant (Ar)','n',0,1)]},
 wallets:{pre:'PF-',cols:[c('id','ID','t',0,1),c('name','Nom','t',0,1),c('type','Type','s',['Compte bancaire','Caisse physique','Mobile Money','Autre'],1),c('legal_holder','Titulaire légal','s','actors',1),c('economic_owner','Propriétaire économique','s','actors',1),c('initial_balance','Solde initial (Ar)','n',0,1),c('ref_date','Date de référence','d')],calc:[['Solde théorique',w=>fmt(bal(w))]]},
 actors:{pre:'AC-',cols:[c('id','ID','t',0,1),c('name','Nom','t',0,1),c('type','Type','s',['Personne','Entreprise'],1),c('status','Statut','s',['Actif','Inactif'],1),c('safety_reserve','Réserve de sécurité (Ar)','n')]},
 debts:{pre:'DT-',cols:[c('id','ID','t',0,1),c('debt_date','Date','d',0,1),c('creditor','Créancier','s','actors',1),c('debtor','Débiteur','s','actors',1),c('type','Type','s',TDET,1),c('initial_amount','Montant initial (Ar)','n',0,1),c('repaid','Remboursé cumulé (Ar)','n'),c('due_date','Échéance','d'),c('operation_id','Opération liée','s','ops'),c('notes','Notes')],calc:[['Solde dû',d=>fmt(due(d))],['Statut',d=>dStat(d)]]},
 forecasts:{pre:'PV-',cols:[c('id','ID','t',0,1),c('forecast_date','Date prévue','d',0,1),c('nature','Nature','s',NPREV,1),c('actor','Acteur','s','actors',1),c('wallet','Portefeuille','s','wallets'),c('category','Catégorie','s','cats'),c('label','Libellé'),c('amount','Montant (Ar)','n',0,1),c('probability','Probabilité','p',0,1)],calc:[['Pondéré signé',f=>fmt(wf(f))]]}
};
const TABS=[['dash','Dashboard'],['patrimoine','Patrimoine'],['operations','Opérations'],['actor_allocations','Répartition'],['wallet_movements','Mouvements'],['wallets','Portefeuilles'],['actors','Acteurs'],['debts','Dettes & créances'],['forecasts','Prévisions'],['controles','Contrôles']];

/* ---------- Calculs (équivalents des formules Excel) ---------- */
const side=a=>(a.imputation==='Emprunteur'||a.imputation==='Bénéficiaire (apport / distribution)')?2:1;
const allocAmt=a=>a.amount_input!=null?+a.amount_input:(+a.pct||0)*(OM[a.operation_id]?.amount||0);
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
function bal(w,upto){
  return +w.initial_balance+sum(D.wallet_movements.filter(m=>m.wallet===w.name),m=>{
    const o=OM[m.operation_id];
    if(!o||o.status!=='Réel'||(w.ref_date&&o.op_date<w.ref_date)||(upto&&o.op_date>upto))return 0;
    return (m.direction==='Entrée'?1:-1)*m.amount;});
}
const due=d=>REMB[d.type]?Math.max(d.initial_amount-(d.repaid||0),0):0;
const dStat=d=>!REMB[d.type]?'Définitif':due(d)<=TOL()?'Soldé':(d.due_date&&d.due_date<today()?'En retard':'En cours');
const wf=f=>(SIGN[f.nature]||0)*f.amount*f.probability;
function opCheck(o){
  if(o.status==='Annulé')return 'Annulée';
  const A=D.actor_allocations.filter(a=>a.operation_id===o.id),M=D.wallet_movements.filter(m=>m.operation_id===o.id),t=TOL();
  const K=sum(A.filter(a=>side(a)==1),allocAmt),L=sum(A.filter(a=>side(a)==2),allocAmt);
  const O=sum(M.filter(m=>m.direction==='Entrée'),m=>m.amount),P=sum(M.filter(m=>m.direction==='Sortie'),m=>m.amount);
  const s=SENS[o.nature]||'Libre',gap='ERREUR : écart montant/mouvements';
  if(!o.op_date||!o.nature||!(o.amount>0))return 'ERREUR : saisie incomplète';
  if(!A.length)return 'ERREUR : sans ventilation acteurs';
  if(Math.abs(K-o.amount)>t)return 'ERREUR : écart répartition acteurs';
  if(L>t&&Math.abs(L-o.amount)>t)return 'ERREUR : écart répartition contrepartie';
  if(!M.length)return 'ERREUR : sans mouvement portefeuille';
  if(s==='Équilibré')return Math.abs(O-P)>t?'ERREUR : transfert déséquilibré':Math.abs(O-o.amount)>t?gap:'OK';
  if(s==='Sortie')return O>t?'ERREUR : entrée inattendue':Math.abs(P-o.amount)>t?gap:'OK';
  if(s==='Entrée')return P>t?'ERREUR : sortie inattendue':Math.abs(O-o.amount)>t?gap:'OK';
  if(O>t&&P>t&&Math.abs(O-P)>t)return 'ERREUR : entrées ≠ sorties';
  return Math.abs(Math.max(O,P)-o.amount)>t?gap:'OK';
}

/* ---------- Filtres ---------- */
function dateOf(t,r){return t==='operations'?r.op_date:t==='debts'?r.debt_date:t==='forecasts'?r.forecast_date:r.operation_id?OM[r.operation_id]?.op_date:null}
function rowOK(t,r){
  const d=dateOf(t,r);
  if(d&&((F.from&&d<F.from)||(F.to&&d>F.to)))return false;
  if(F.actor){
    if(t==='operations'&&!D.actor_allocations.some(a=>a.operation_id===r.id&&a.actor===F.actor))return false;
    const v=[r.actor,r.creditor,r.debtor,r.legal_holder,r.economic_owner,t==='actors'?r.name:null];
    if(v.some(x=>x!=null)&&!v.includes(F.actor))return false;
  }
  if(F.wallet){
    if(t==='operations'&&!D.wallet_movements.some(m=>m.operation_id===r.id&&m.wallet===F.wallet))return false;
    if(t==='wallets'&&r.name!==F.wallet)return false;
    if((t==='wallet_movements'||t==='forecasts')&&r.wallet!==F.wallet)return false;
  }
  if(F.cat&&'category' in r&&r.category!==F.cat)return false;
  return true;
}
function fOps(){return D.operations.filter(o=>o.status==='Réel'&&rowOK('operations',o))}
function amt(o){
  if(F.wallet)return sum(D.wallet_movements.filter(m=>m.operation_id===o.id&&m.wallet===F.wallet),m=>m.amount);
  if(F.actor)return sum(D.actor_allocations.filter(a=>a.operation_id===o.id&&a.actor===F.actor),allocAmt);
  return o.amount;
}
const wallets=()=>D.wallets.filter(w=>(!F.wallet||w.name===F.wallet)&&(!F.actor||w.economic_owner===F.actor));

/* ---------- Données ---------- */
async function all(t){
  let out=[],i=0;
  for(;;){
    const{data,error}=await sb.from(t).select('*').range(i,i+999);
    if(error)throw error;
    out=out.concat(data);
    if(data.length<1000)return out;
    i+=1000;
  }
}
async function load(){
  const T=['actors','wallets','categories','settings','operations','actor_allocations','wallet_movements','debts','forecasts'];
  try{
    const r=await Promise.all(T.map(all));
    T.forEach((t,i)=>D[t]=r[i]);
    D.settings=Object.fromEntries(D.settings.map(s=>[s.key,s.value]));
    OM=Object.fromEntries(D.operations.map(o=>[o.id,o]));
    D.operations.sort((a,b)=>b.op_date.localeCompare(a.op_date)||b.id.localeCompare(a.id));
    $('#msg').textContent='';
  }catch(e){$('#msg').textContent='Erreur de chargement : '+e.message}
}
function fillFilters(){
  const f=(id,arr,ph)=>{const s=$(id),v=s.value;s.innerHTML=`<option value="">${ph}</option>`+arr.map(x=>`<option>${esc(x)}</option>`).join('');s.value=v};
  f('#fa',D.actors.map(a=>a.name),'Tous');f('#fw',D.wallets.map(w=>w.name),'Tous');f('#fc',D.categories.map(x=>x.name),'Toutes');
}

/* ---------- Affichage ---------- */
function mk(id,cfg){
  charts[id]?.destroy();
  const el=$('#'+id);if(!el)return;
  cfg.options={responsive:true,maintainAspectRatio:false,...cfg.options};
  charts[id]=new Chart(el,cfg);
}
const yAx={ticks:{callback:v=>fmt(v)}};
const tip={plugins:{tooltip:{callbacks:{label:x=>`${x.dataset.label||x.label} : ${fmt(x.parsed.y??x.parsed)} Ar`}}}};
const kpi=(l,v,k='')=>`<div class="k"><small>${l}</small><b class="${k}">${v}</b></div>`;

function anomalies(){
  const A=[];
  D.operations.forEach(o=>{const r=opCheck(o);if(r.startsWith('ERREUR'))A.push(['Opérations',o.id,r])});
  D.wallets.forEach(w=>{if(bal(w)<0)A.push(['Alerte · Portefeuilles',w.name,'solde théorique négatif'])});
  D.debts.forEach(d=>{if(dStat(d)==='En retard')A.push(['Alerte · Dettes',d.id,'échéance dépassée'])});
  return A;
}

function dash(){
  const ops=fOps(),dep=sum(ops.filter(o=>o.nature==='Dépense'),amt),rec=sum(ops.filter(o=>o.nature==='Recette'),amt);
  const W=wallets(),tre=sum(W,w=>bal(w,F.to));
  const dts=sum(D.debts.filter(d=>rowOK('debts',d)),due);
  const fc=sum(D.forecasts.filter(f=>rowOK('forecasts',f)),wf);
  const err=anomalies().filter(a=>!a[0].startsWith('Alerte')).length;
  const ids=new Map(ops.map(o=>[o.id,o]));
  const rent=D.actors.filter(a=>!F.actor||a.name===F.actor).map(a=>{
    let d=0,r=0;
    D.actor_allocations.forEach(x=>{const o=ids.get(x.operation_id);if(o&&x.actor===a.name){if(o.nature==='Dépense')d+=allocAmt(x);if(o.nature==='Recette')r+=allocAmt(x)}});
    return[a,d,r];});
  $('#view').innerHTML=`
  <div class="kpis">${kpi('Opérations réelles (période)',ops.length)}${kpi('Dépenses (Ar)',fmt(dep),'neg')}${kpi('Recettes (Ar)',fmt(rec),'pos')}
   ${kpi('Solde recettes − dépenses (Ar)',fmt(rec-dep),cls(rec-dep))}${kpi('Trésorerie'+(F.to?' au '+F.to:'')+' (Ar)',fmt(tre),cls(tre))}
   ${kpi('Dettes en cours (Ar)',fmt(dts))}${kpi('Prévisions : flux net pondéré (Ar)',fmt(fc),cls(fc))}
   ${kpi('Cohérence',err?err+' anomalie(s)':'✔ Tout est cohérent',err?'bad':'pos')}</div>
  <div class="grid">
   <div class="box"><h2>Dépenses et recettes par mois</h2><div class="ch"><canvas id="c1"></canvas></div></div>
   <div class="box"><h2>Solde cumulé sur la période</h2><div class="ch"><canvas id="c2"></canvas></div></div>
   <div class="box"><h2>Dépenses par catégorie</h2><div class="ch"><canvas id="c3"></canvas></div></div>
   <div class="box"><h2>Trésorerie par portefeuille</h2><div class="ch"><canvas id="c4"></canvas></div></div>
   <div class="box"><h2>Prévisions pondérées : 12 mois à partir d'aujourd'hui</h2><div class="ch"><canvas id="c5"></canvas></div></div>
  </div>
  <div class="box"><h2>Trésorerie par portefeuille</h2><table><tr><th>Portefeuille<th>Titulaire légal<th>Propriétaire économique<th class="n">Solde initial<th class="n">Solde théorique</tr>
   ${W.map(w=>`<tr><td>${esc(w.name)}<td>${esc(w.legal_holder)}<td>${esc(w.economic_owner)}<td class="n">${fmt(w.initial_balance)}<td class="n ${cls(bal(w,F.to))}">${fmt(bal(w,F.to))}`).join('')}
   <tr><th>Total<th><th><th class="n">${fmt(sum(W,w=>+w.initial_balance))}<th class="n">${fmt(tre)}</tr></table></div>
  <div class="box"><h2>Rentabilité simplifiée par acteur</h2><table><tr><th>Acteur<th>Type<th class="n">Dépenses imputées<th class="n">Recettes imputées<th class="n">Solde</tr>
   ${rent.map(([a,d,r])=>`<tr><td>${esc(a.name)}<td>${a.type}<td class="n">${fmt(d)}<td class="n">${fmt(r)}<td class="n ${cls(r-d)}">${fmt(r-d)}`).join('')}</table></div>`;

  const M={};ops.forEach(o=>{if(o.nature!=='Dépense'&&o.nature!=='Recette')return;const k=o.op_date.slice(0,7);M[k]??={d:0,r:0};M[k][o.nature==='Dépense'?'d':'r']+=amt(o)});
  const ks=Object.keys(M).sort();let cu=0;
  mk('c1',{type:'bar',data:{labels:ks,datasets:[{label:'Recettes',data:ks.map(k=>M[k].r),backgroundColor:'#1f7a4d'},{label:'Dépenses',data:ks.map(k=>M[k].d),backgroundColor:'#b3412e'}]},options:{scales:{y:yAx},...tip}});
  mk('c2',{type:'line',data:{labels:ks,datasets:[{label:'Solde cumulé',data:ks.map(k=>cu+=M[k].r-M[k].d),borderColor:'#0f5c73',backgroundColor:'#0f5c7322',fill:true,tension:.25}]},options:{scales:{y:yAx},...tip}});
  const C={};ops.filter(o=>o.nature==='Dépense').forEach(o=>{const k=o.category||'Sans catégorie';C[k]=(C[k]||0)+amt(o)});
  mk('c3',{type:'doughnut',data:{labels:Object.keys(C),datasets:[{data:Object.values(C),backgroundColor:PAL}]},options:{plugins:{tooltip:{callbacks:{label:x=>`${x.label} : ${fmt(x.parsed)} Ar`}}}}});
  mk('c4',{type:'bar',data:{labels:W.map(w=>w.name),datasets:[{label:'Solde théorique',data:W.map(w=>bal(w,F.to)),backgroundColor:W.map(w=>bal(w,F.to)<0?'#b3412e':'#0f5c73')}]},options:{indexAxis:'y',scales:{x:yAx},plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>fmt(x.parsed.x)+' Ar'}}}}});
  const ms=[...Array(12)].map((_,i)=>ym(i)),FP=ms.map(m=>D.forecasts.filter(f=>f.forecast_date.slice(0,7)===m&&(!F.actor||f.actor===F.actor)&&(!F.wallet||f.wallet===F.wallet)&&(!F.cat||f.category===F.cat)).map(wf));
  let run=sum(D.wallets,w=>bal(w));
  mk('c5',{data:{labels:ms,datasets:[{type:'bar',label:'Encaissements',data:FP.map(a=>sum(a.filter(x=>x>0),x=>x)),backgroundColor:'#1f7a4d'},{type:'bar',label:'Dépenses',data:FP.map(a=>sum(a.filter(x=>x<0),x=>x)),backgroundColor:'#b3412e'},{type:'line',label:'Trésorerie + flux cumulés',data:FP.map(a=>run+=sum(a,x=>x)),borderColor:'#16212b',tension:.25}]},options:{scales:{y:yAx},...tip}});
}

function patrimoine(){
  const t=today(),h=addDays(t,HOR());
  const P=D.actors.map(a=>{
    const C=sum(D.wallets.filter(w=>w.economic_owner===a.name),w=>bal(w)),L=sum(D.wallets.filter(w=>w.legal_holder===a.name),w=>bal(w));
    const E=sum(D.debts.filter(d=>d.creditor===a.name),due),Fd=sum(D.debts.filter(d=>d.debtor===a.name),due);
    const H=sum(D.debts.filter(d=>d.debtor===a.name&&d.due_date&&d.due_date<=h),due);
    const I=-sum(D.forecasts.filter(f=>f.actor===a.name&&wf(f)<0&&f.forecast_date>=t&&f.forecast_date<=h&&f.nature!=='Remboursement à payer'),wf);
    const J=+a.safety_reserve||0;
    return{a,C,L,E,Fd,G:C+E-Fd,H,I,J,K:Math.max(0,C-H-I-J)};});
  const tre=sum(D.wallets,w=>bal(w)),loans=sum(D.debts,due),A10=D.actors.slice(0,10);
  const tot=k=>fmt(sum(P,p=>p[k]));
  $('#view').innerHTML=`
  <div class="kpis">${kpi('Trésorerie totale (Ar)',fmt(tre),cls(tre))}${kpi('Prêts et avances internes (Ar)',fmt(loans))}${kpi('Patrimoine net consolidé (Ar)',fmt(tre),cls(tre))}
   ${kpi('Double comptage évité (Ar)',fmt(loans))}${kpi(`Capacité d'investissement (${HOR()} j)`,tot('K'),'pos')}</div>
  <div class="box"><h2>Patrimoine net par acteur</h2><div class="ch"><canvas id="p1"></canvas></div></div>
  <div class="box"><h2>Patrimoine par acteur</h2><table><tr><th>Acteur<th>Type<th class="n">Trésorerie (propriétaire)<th class="n">Détenu légalement<th class="n">Créances<th class="n">Dettes<th class="n">Patrimoine net<th class="n">Dettes exigibles (${HOR()} j)<th class="n">Dépenses prévues<th class="n">Réserve<th class="n">Capacité</tr>
   ${P.map(p=>`<tr><td>${esc(p.a.name)}<td>${p.a.type}<td class="n">${fmt(p.C)}<td class="n">${fmt(p.L)}<td class="n">${fmt(p.E)}<td class="n">${fmt(p.Fd)}<td class="n ${cls(p.G)}">${fmt(p.G)}<td class="n">${fmt(p.H)}<td class="n">${fmt(p.I)}<td class="n">${fmt(p.J)}<td class="n"><b>${fmt(p.K)}</b>`).join('')}
   <tr><th>Total<th><th class="n">${tot('C')}<th class="n">${tot('L')}<th class="n">${tot('E')}<th class="n">${tot('Fd')}<th class="n">${tot('G')}<th class="n">${tot('H')}<th class="n">${tot('I')}<th class="n">${tot('J')}<th class="n">${tot('K')}</tr></table>
   <p><small>Capacité = trésorerie − dettes exigibles − dépenses prévues pondérées − réserve. Les recettes attendues sont exclues volontairement (prudence). Réserve : modifiable dans l'onglet Acteurs ; horizon : table settings.</small></p></div>
  <div class="box"><h2>Qui doit à qui ? (ligne = créancier, colonne = débiteur)</h2><table><tr><th>Créancier ↓ / Débiteur →${A10.map(a=>`<th class="n">${esc(a.name)}`).join('')}<th class="n">Total dû à lui</tr>
   ${A10.map(cr=>`<tr><td>${esc(cr.name)}${A10.map(de=>`<td class="n">${fmt(sum(D.debts.filter(d=>d.creditor===cr.name&&d.debtor===de.name),due))}`).join('')}<td class="n"><b>${fmt(sum(D.debts.filter(d=>d.creditor===cr.name),due))}</b>`).join('')}</table></div>`;
  mk('p1',{type:'bar',data:{labels:P.map(p=>p.a.name),datasets:[{label:'Trésorerie',data:P.map(p=>p.C),backgroundColor:'#0f5c73'},{label:'Créances',data:P.map(p=>p.E),backgroundColor:'#d29a2b'},{label:'Dettes',data:P.map(p=>-p.Fd),backgroundColor:'#b3412e'}]},options:{scales:{y:{...yAx,stacked:true},x:{stacked:true}},...tip}});
}

function controles(){
  const A=anomalies(),err=A.filter(a=>!a[0].startsWith('Alerte')).length;
  $('#view').innerHTML=`<div class="kpis">${kpi('Statut global',err?err+' anomalie(s) à corriger':'✔ Tout est cohérent',err?'bad':'pos')}${kpi('Alertes à surveiller',A.length-err)}</div>
  <div class="box"><h2>Anomalies et alertes</h2><table><tr><th>Famille<th>Élément<th>Détail</tr>
  ${A.map(a=>`<tr><td>${a[0]}<td>${esc(a[1])}<td class="${a[0].startsWith('Alerte')?'':'bad'}">${esc(a[2])}`).join('')||'<tr><td colspan="3">Aucune anomalie.</tr>'}</table></div>`;
}

function list(t){
  const cf=CFG[t],cols=cf.cols.filter(x=>!(cf.auto&&x.k==='id')),rows=D[t].filter(r=>rowOK(t,r));
  const cell=(x,v)=>v==null||v===''?'':x.t==='p'?pc(v):x.t==='n'?fmt(v):esc(v);
  $('#view').innerHTML=`<div class="bar"><b>${rows.length} ligne(s) · filtres appliqués</b><button class="btn p" onclick="edit('${t}')">+ Ajouter</button></div>
  <div class="box"><table><tr>${cols.map(x=>`<th class="${x.t==='n'||x.t==='p'?'n':''}">${x.l}`).join('')}${(cf.calc||[]).map(k=>`<th>${k[0]}`).join('')}<th></tr>
  ${rows.slice(0,500).map(r=>`<tr>${cols.map(x=>`<td class="${x.t==='n'||x.t==='p'?'n':''}">${cell(x,r[x.k])}`).join('')}${(cf.calc||[]).map(k=>{const v=k[1](r);return`<td class="${String(v).startsWith('ERREUR')||v==='En retard'?'bad':''}">${esc(v)}`}).join('')}
  <td><button class="btn s" onclick="edit('${t}','${r.id}')">Modifier</button> <button class="btn s" onclick="del('${t}','${r.id}')">Suppr.</button>`).join('')}</table>
  ${rows.length>500?'<p><small>500 premières lignes affichées : affinez les filtres.</small></p>':''}</div>`;
}

function render(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');
  Object.values(charts).forEach(ch=>ch.destroy());charts={};
  ({dash,patrimoine,controles}[tab]||(()=>list(tab)))();
}

/* ---------- Saisie ---------- */
const opts=o=>o==='cats'?D.categories.map(x=>x.name):o==='actors'?D.actors.map(x=>x.name):o==='wallets'?D.wallets.map(x=>x.name):o==='ops'?D.operations.map(x=>x.id):o;
function edit(t,id){
  const cf=CFG[t],r=id!=null?D[t].find(x=>String(x.id)===String(id)):null;
  const next=cf.pre?cf.pre+String(Math.max(0,...D[t].map(x=>parseInt(String(x.id).replace(/\D/g,''))||0))+1).padStart(4,'0'):'';
  $('#f').innerHTML=`<h2>${r?'Modifier':'Ajouter'}</h2>`+cf.cols.filter(x=>!(cf.auto&&x.k==='id')).map(x=>{
    let v=r?r[x.k]:(x.k==='id'?next:x.k==='status'&&t==='operations'?'Réel':'');v=v??'';
    const q=x.req?' required':'',nm=` name="${x.k}"`;
    if(x.t==='s')return`<label>${x.l}<select${nm}${q}><option value="">—</option>${opts(x.o).map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
    if(x.t==='p')return`<label>${x.l} (en %)<input${nm}${q} type="number" step="any" min="0" max="100" value="${v===''?'':Math.round(v*10000)/100}"></label>`;
    return`<label>${x.l}<input${nm}${q} type="${x.t==='d'?'date':x.t==='n'?'number':'text'}"${x.t==='n'?' step="any"':''} value="${esc(v)}"${r&&x.k==='id'?' readonly':''}></label>`;
  }).join('')+`<div class="bar"><button type="button" class="btn" onclick="$('#dlg').close()">Annuler</button><button class="btn p">Enregistrer</button></div>`;
  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const o={};
    cf.cols.forEach(x=>{
      const el=$('#f').elements[x.k];if(!el)return;
      let v=el.value;
      o[x.k]=v===''?null:x.t==='n'?+v:x.t==='p'?+v/100:v;
    });
    if(t==='debts'&&o.repaid==null)o.repaid=0;
    if(t==='actors'&&o.safety_reserve==null)o.safety_reserve=0;
    if(t==='wallets'&&o.initial_balance==null)o.initial_balance=0;
    const q=r?sb.from(t).update(o).eq('id',r.id):sb.from(t).insert(o);
    const{error}=await q;
    if(error){alert('Enregistrement refusé : '+error.message);return}
    $('#dlg').close();await refresh();
  };
  $('#dlg').showModal();
}
async function del(t,id){
  if(!confirm('Supprimer cette ligne ?'+(t==='operations'?' Sa répartition et ses mouvements seront supprimés aussi.':'')))return;
  const{error}=await sb.from(t).delete().eq('id',id);
  if(error){alert('Suppression refusée : '+error.message);return}
  await refresh();
}
async function refresh(){await load();fillFilters();render()}

/* ---------- Événements ---------- */
$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
[['fd','from'],['ft','to'],['fa','actor'],['fw','wallet'],['fc','cat']].forEach(([id,k])=>$('#'+id).onchange=e=>{
  F[k]=e.target.value;
  if(F.from&&F.to&&F.from>F.to){[F.from,F.to]=[F.to,F.from];$('#fd').value=F.from;$('#ft').value=F.to}
  render();
});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  const p=b.dataset.p,n=new Date(),y=n.getFullYear(),m=n.getMonth(),iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(p==='m'){F.from=iso(new Date(y,m,1));F.to=iso(new Date(y,m+1,0))}
  else if(p==='30'){F.to=today();F.from=addDays(F.to,-30)}
  else if(p==='y'){F.from=y+'-01-01';F.to=y+'-12-31'}
  else{F.from=F.to=''}
  $('#fd').value=F.from;$('#ft').value=F.to;render();
});
async function start(){
  $('#auth').hidden=true;$('#app').hidden=false;
  await refresh();
}
$('#auth').onsubmit=async e=>{
  e.preventDefault();
  const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
  if(error)$('#err').textContent=error.message;else start();
};
$('#out').onclick=async()=>{await sb.auth.signOut();$('#app').hidden=true;$('#auth').hidden=false};
(async()=>{
  if(SUPABASE_URL.includes('VOTRE')){document.body.innerHTML='<p style="padding:24px">Renseignez SUPABASE_URL et SUPABASE_ANON_KEY dans <b>supabase.js</b>.</p>';return}
  const{data:{session}}=await sb.auth.getSession();
  session?start():$('#auth').hidden=false;
})();
</script>
